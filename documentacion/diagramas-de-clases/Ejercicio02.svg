<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1280" viewBox="0 0 1100 1280"><rect width="1100" height="1280" fill="white"/><defs><marker id="herencia" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto"><path d="M 1 1 L 13 7 L 1 13 Z" fill="white" stroke="#345678"/></marker><marker id="uso" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#345678"/></marker></defs><g font-family="Arial" font-size="14"><rect x='30' y='30' width='310' height='240' rx='3' fill='#eef5ff' stroke='#345678'/><text x='42' y='56' font-weight='bold'>Socio</text><text x='42' y='80' font-weight='normal'>+ int Id</text><text x='42' y='104' font-weight='normal'>+ string Nombre</text><rect x='370' y='30' width='310' height='240' rx='3' fill='#eef5ff' stroke='#345678'/><text x='382' y='56' font-weight='bold'>Cuenta (abstracta)</text><text x='382' y='80' font-weight='normal'>+ int Numero</text><text x='382' y='104' font-weight='normal'>+ int SocioId</text><text x='382' y='128' font-weight='normal'>+ decimal Saldo</text><text x='382' y='152' font-weight='normal'>+ bool Activa</text><text x='382' y='176' font-weight='normal'>+ DateOnly Apertura</text><text x='382' y='200' font-weight='normal'>+ PermiteSaldo(decimal): bool</text><text x='382' y='224' font-weight='normal'>+ InteresMensual(): decimal</text><rect x='740' y='30' width='310' height='240' rx='3' fill='#eef5ff' stroke='#345678'/><text x='752' y='56' font-weight='bold'>Movimiento</text><text x='752' y='80' font-weight='normal'>+ int Id</text><text x='752' y='104' font-weight='normal'>+ int CuentaNumero</text><text x='752' y='128' font-weight='normal'>+ DateOnly Fecha</text><text x='752' y='152' font-weight='normal'>+ string Tipo</text><text x='752' y='176' font-weight='normal'>+ decimal Monto</text><text x='752' y='200' font-weight='normal'>+ decimal SaldoPosterior</text><text x='752' y='224' font-weight='normal'>+ string Detalle</text><text x='752' y='248' font-weight='normal'>+ string? TransferenciaId</text><rect x='190' y='340' width='310' height='240' rx='3' fill='#eef5ff' stroke='#345678'/><text x='202' y='366' font-weight='bold'>CuentaAhorro</text><text x='202' y='390' font-weight='normal'>+ PermiteSaldo(decimal): bool</text><text x='202' y='414' font-weight='normal'>+ InteresMensual(): decimal</text><text x='202' y='438' font-weight='normal'>Saldo minimo: $5</text><text x='202' y='462' font-weight='normal'>Interes anual: 4 %</text><rect x='550' y='340' width='310' height='240' rx='3' fill='#eef5ff' stroke='#345678'/><text x='562' y='366' font-weight='bold'>CuentaCorriente</text><text x='562' y='390' font-weight='normal'>+ PermiteSaldo(decimal): bool</text><text x='562' y='414' font-weight='normal'>+ InteresMensual(): decimal</text><text x='562' y='438' font-weight='normal'>Sobregiro: hasta $200</text><text x='562' y='462' font-weight='normal'>Sin intereses</text><rect x='30' y='630' width='310' height='240' rx='3' fill='#eef5ff' stroke='#345678'/><text x='42' y='656' font-weight='bold'>DatosCooperativa</text><text x='42' y='680' font-weight='normal'>+ List&lt;Socio&gt; Socios</text><text x='42' y='704' font-weight='normal'>+ List&lt;Cuenta&gt; Cuentas</text><text x='42' y='728' font-weight='normal'>+ List&lt;Movimiento&gt; Movimientos</text><rect x='370' y='630' width='310' height='240' rx='3' fill='#eef5ff' stroke='#345678'/><text x='382' y='656' font-weight='bold'>Cooperativa</text><text x='382' y='680' font-weight='normal'>- DatosCooperativa datos</text><text x='382' y='704' font-weight='normal'>- ArchivoJson archivo</text><text x='382' y='728' font-weight='normal'>+ AgregarSocio() / AbrirCuenta()</text><text x='382' y='752' font-weight='normal'>+ Depositar() / Retirar()</text><text x='382' y='776' font-weight='normal'>+ Transferir() / AplicarIntereses()</text><text x='382' y='800' font-weight='normal'>+ CerrarCuenta() / Consultar()</text><rect x='740' y='630' width='310' height='240' rx='3' fill='#eef5ff' stroke='#345678'/><text x='752' y='656' font-weight='bold'>ArchivoJson</text><text x='752' y='680' font-weight='normal'>+ string Ruta</text><text x='752' y='704' font-weight='normal'>+ Cargar(): DatosCooperativa</text><text x='752' y='728' font-weight='normal'>+ Guardar(DatosCooperativa)</text><text x='752' y='752' font-weight='normal'>+ Copiar(): DatosCooperativa</text><rect x='370' y='970' width='310' height='240' rx='3' fill='#eef5ff' stroke='#345678'/><text x='382' y='996' font-weight='bold'>ReportesCooperativa (estatica)</text><text x='382' y='1020' font-weight='normal'>+ EstadoCuenta()</text><text x='382' y='1044' font-weight='normal'>+ InteresesMes()</text><text x='382' y='1068' font-weight='normal'>+ Sobregiros()</text><text x='382' y='1092' font-weight='normal'>+ Totales()</text><text x='382' y='1116' font-weight='normal'>+ Auditar()</text><path marker-end='url(#uso)' d='M 340 150 L 370 150' stroke='#345678' fill='none'/><text x='355' y='144' font-size='12' text-anchor='middle'>1 posee 0..*</text><path marker-end='url(#uso)' d='M 680 150 L 740 150' stroke='#345678' fill='none'/><text x='710' y='144' font-size='12' text-anchor='middle'>1 registra 0..*</text><path marker-end='url(#herencia)' d='M 345 340 L 525 270' stroke='#345678' fill='none'/><text x='435' y='299' font-size='12' text-anchor='middle'>hereda</text><path marker-end='url(#herencia)' d='M 705 340 L 525 270' stroke='#345678' fill='none'/><text x='615' y='299' font-size='12' text-anchor='middle'>hereda</text><path marker-end='url(#uso)' d='M 370 750 L 340 750' stroke='#345678' fill='none'/><text x='355' y='744' font-size='12' text-anchor='middle'>administra</text><path marker-end='url(#uso)' d='M 680 750 L 740 750' stroke='#345678' fill='none'/><text x='710' y='744' font-size='12' text-anchor='middle'>guarda / carga</text><path marker-end='url(#uso)' d='M 525 970 L 185 870' stroke='#345678' fill='none'/><text x='355' y='914' font-size='12' text-anchor='middle'>consulta</text></g></svg>
